<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#EFE3C9">
  <title>Blog | Leafora</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: light; --bg:#EFE3C9; --surface:#FAF5E8; --sage:#DCE7CE; --forest:#17482C; --ink:#173626; --muted:#46604F; --accent:#1F6B3E; --line:#D6C8A4; --gutter:clamp(16px,4vw,32px); --display:'Fraunces',Georgia,serif; --body:'Montserrat',system-ui,sans-serif; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.6 var(--body); }
    a { color:inherit; }
    .wrap { width:min(1120px,100%); margin:auto; padding-inline:max(var(--gutter),env(safe-area-inset-left,0px)); }
    .site { position:sticky; top:0; z-index:2; background:var(--bg); border-bottom:1px solid var(--line); }
    .site .wrap { min-height:64px; display:flex; align-items:center; justify-content:space-between; gap:16px; }
    .brand { color:var(--accent); text-decoration:none; font:700 1.5rem var(--display); }
    .links { display:flex; align-items:center; gap:clamp(12px,3vw,24px); }
    .nav-link { color:var(--ink); text-decoration:none; font-size:.9rem; font-weight:500; }
    .nav-link:hover,.nav-link[aria-current="page"] { color:var(--accent); }
    main { min-height:calc(100vh - 160px); padding-block:clamp(64px,12vw,136px); }
    .journal { max-width:740px; padding:clamp(28px,6vw,64px); background:var(--surface); border:1px solid var(--line); border-radius:24px; }
    .eyebrow { margin:0 0 12px; color:var(--muted); font-size:.75rem; font-weight:600; letter-spacing:.14em; text-transform:uppercase; }
    h1 { margin:0 0 16px; color:var(--accent); font:700 clamp(2.5rem,7vw,4.5rem)/1.05 var(--display); letter-spacing:-.03em; }
    .intro { max-width:54ch; color:var(--muted); }
    .empty { margin-top:36px; padding:22px 24px; background:var(--sage); border-radius:14px; }
    .empty p { margin:0; }
    footer { padding-block:24px; background:var(--forest); color:#F0E7D3; font-size:.85rem; }
    footer .wrap { display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; }
    @media(max-width:560px) { .site .wrap { align-items:flex-start; padding-block:12px; flex-direction:column; } .links { width:100%; flex-wrap:wrap; } }
  </style>
</head>
<body>
  <header class="site">
    <div class="wrap">
      <a class="brand" href="index.html" aria-label="Leafora home">Leafora</a>
      <nav class="links" aria-label="Main navigation">
        <a class="nav-link" href="index.html#shop">Plants</a>
        <a class="nav-link" href="index.html#why">Why Leafora</a>
        <a class="nav-link" href="blog.html" aria-current="page">Blog</a>
        <a class="nav-link" href="index.html#visit">Visit</a>
      </nav>
    </div>
  </header>
  <main>
    <div class="wrap">
      <section class="journal" aria-labelledby="journal-title">
        <p class="eyebrow">The Leafora journal</p>
        <h1 id="journal-title">Growing, together.</h1>
        <p class="intro">Plant care notes, growing tips and stories from Leafora will live here.</p>
        <div class="empty" role="status"><p>Our first post is on its way. Check back soon.</p></div>
      </section>
    </div>
  </main>
  <footer><div class="wrap"><span>Leafora | Plants, online &amp; physical store</span><span>© <span id="year"></span> Leafora</span></div></footer>
  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
