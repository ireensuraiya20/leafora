<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#EFE3C9"><title>Leafora Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <header class="topbar"><a href="index.html" class="brand">Leafora <span>Dashboard</span></a><nav><a href="orders.html" class="back">Manage orders</a> &nbsp; <a href="index.html" class="back">View website ↗</a></nav></header>
  <main class="shell">
    <section class="panel" id="login-panel">
      <p class="eyebrow">Private area</p><h1>Sign in to edit Leafora</h1>
      <p class="muted" id="setup-note">Use the admin account invited in Supabase Auth.</p>
      <form id="login-form" class="login-form">
        <label>Email<input name="email" type="email" autocomplete="username" required></label>
        <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
        <button class="button" type="submit">Sign in</button>
      </form>
      <p class="status" id="login-status" role="status" aria-live="polite"></p>
    </section>
    <section class="editor" id="editor-panel" hidden>
      <div class="editor-heading"><div><p class="eyebrow">Content management</p><h1>Edit your website</h1><p class="muted">Changes save to Supabase and appear on the public pages.</p></div><button class="button secondary" id="sign-out" type="button">Sign out</button></div>
      <div class="notice" id="connection-status" role="status"></div>
      <form id="content-form"><div id="content-fields"></div><div class="save-row"><p class="status" id="save-status" role="status" aria-live="polite"></p><button class="button" id="save-button" type="submit">Save changes</button></div></form>
    </section>
  </main>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script><script src="site-content.js"></script><script src="admin.js"></script>
</body>
</html>
